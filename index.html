<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pad Frame">
<title>Pad Frame</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;}
body{background:#000;overflow:hidden;font-family:-apple-system,sans-serif;margin:0;padding:0;}
#wrap{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;}
#imgA,#imgB{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;background-repeat:no-repeat;}
#imgA{opacity:1;z-index:1;}
#imgB{opacity:0;z-index:2;}
#clock{position:fixed;bottom:30px;right:30px;text-align:right;z-index:999;}
#weatherWrap{position:fixed;bottom:30px;left:30px;display:flex;align-items:center;z-index:999;text-shadow:0 0 20px rgba(0,0,0,0.8),0 2px 4px rgba(0,0,0,0.8);}
#wIcon{font-size:90px;margin-right:15px;line-height:1;}
#wTemp{color:#fff;font-size:80px;font-weight:200;letter-spacing:2px;line-height:1;}
#timeEl{color:#fff;font-size:110px;font-weight:200;letter-spacing:2px;text-shadow:0 0 20px rgba(0,0,0,0.8),0 2px 4px rgba(0,0,0,0.8);}
#dateEl{color:#fff;font-size:36px;font-weight:300;margin-top:2px;text-shadow:0 0 20px rgba(0,0,0,0.8),0 2px 4px rgba(0,0,0,0.8);}
#welcome{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;z-index:500;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;text-align:center;padding:30px;}
#welcome h1{font-size:32px;font-weight:300;margin-bottom:10px;}
#welcome p{color:#888;font-size:15px;margin-bottom:10px;line-height:1.5;}
#welcome .note{color:#5856d6;font-size:13px;margin-bottom:28px;}
.btn{background:#5856d6;color:#fff;border:none;border-radius:12px;padding:14px 36px;font-size:17px;font-weight:600;cursor:pointer;}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:600;display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;}
#loading.show{display:flex;}
#loadTxt{font-size:16px;color:#888;margin-top:12px;}
#bar{width:180px;height:4px;background:#333;border-radius:2px;margin-top:10px;}
#fill{height:100%;background:#5856d6;border-radius:2px;width:0;transition:width 0.2s;}
#settings{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.65);z-index:400;justify-content:center;align-items:center;}
#settings.show{display:flex;}
#panel{background:#1c1c1e;border-radius:16px;padding:22px;width:300px;max-height:80vh;overflow-y:auto;color:#fff;}
#panel h2{text-align:center;font-size:19px;font-weight:600;margin-bottom:18px;}
.stitle{color:#888;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-top:18px;margin-bottom:6px;}
.upbtn{display:block;width:100%;background:#5856d6;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:4px;}
.pcount{color:#888;font-size:12px;text-align:center;margin-bottom:6px;}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:10px;margin-bottom:3px;cursor:pointer;color:#ccc;font-size:15px;}
.row.on{background:rgba(255,255,255,0.1);color:#fff;font-weight:600;}
.ck{color:#4CD964;}
.swrow{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;}
.swlbl{color:#fff;font-size:15px;}
.tog{position:relative;width:48px;height:28px;}
.tog input{display:none;}
.tslide{position:absolute;top:0;left:0;right:0;bottom:0;background:#3a3a3c;border-radius:28px;cursor:pointer;transition:0.3s;}
.tslide:before{content:'';position:absolute;width:24px;height:24px;left:2px;top:2px;background:#fff;border-radius:50%;transition:0.3s;}
.tog input:checked+.tslide{background:#4CD964;}
.tog input:checked+.tslide:before{transform:translateX(20px);}
.donebtn{display:block;width:100%;background:#2c2c2e;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;margin-top:18px;}
#fi,#fi2{display:none;}
</style>
</head>
<body>

<div id="welcome">
  <h1>🖼️ Pad Frame</h1>
  <p>Turn your old iPad into a beautiful digital photo frame.</p>
  <p class="note" style="margin-bottom:10px;">Select up to 20 photos for best performance</p>
  <p class="note" style="color:#aaa;">Tip: Set iPad Auto-Lock to "Never" in Settings</p>
  <button class="btn" onclick="document.getElementById('fi').click()">Select Photos</button>
  <input type="file" id="fi" accept="image/*" multiple onchange="load(this)">
</div>

<div id="loading">
  <div id="loadTxt">Loading...</div>
  <div id="bar"><div id="fill"></div></div>
</div>

<div id="wrap">
  <div id="imgA"></div>
  <div id="imgB"></div>
</div>

<div id="weatherWrap">
  <div id="wIcon"></div>
  <div id="wTemp"></div>
</div>

<div id="clock">
  <div id="timeEl"></div>
  <div id="dateEl"></div>
</div>

<div id="settings">
  <div id="panel">
    <h2>Settings</h2>
    <div class="stitle">Photos</div>
    <button class="upbtn" onclick="document.getElementById('fi2').click()">Change Photos</button>
    <input type="file" id="fi2" accept="image/*" multiple onchange="load(this)">
    <div class="pcount" id="pc">0 photos</div>
    <div class="stitle">Transition</div>
    <div id="efx"></div>
    <div class="stitle">Duration</div>
    <div id="ivl"></div>
    <div class="stitle">Display</div>
    <div class="swrow">
      <span class="swlbl">Show Clock</span>
      <label class="tog">
        <input type="checkbox" id="clkTog" checked onchange="document.getElementById('clock').style.display=this.checked?'block':'none'">
        <span class="tslide"></span>
      </label>
    </div>
    <button class="donebtn" onclick="document.getElementById('settings').classList.remove('show')">Done</button>
  </div>
</div>

<script>
var photos=[],idx=0,layer='A',timer=null,efxIdx=0,ivl=5000,busy=false;
var EFX=['fade','slideLeft','slideUp'];
var ELBL={fade:'Fade',slideLeft:'Slide Left',slideUp:'Slide Up'};
var IVL=[{l:'3 sec',v:3000},{l:'5 sec',v:5000},{l:'10 sec',v:10000},{l:'30 sec',v:30000},{l:'1 min',v:60000}];
var A=document.getElementById('imgA'),B=document.getElementById('imgB');

function tick(){
  var n=new Date(),h=('0'+n.getHours()).slice(-2),m=('0'+n.getMinutes()).slice(-2);
  document.getElementById('timeEl').textContent=h+':'+m;
  var D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dateEl').textContent=D[n.getDay()]+', '+M[n.getMonth()]+' '+n.getDate()+' '+n.getFullYear();
}
setInterval(tick,1000);tick();

function fetchWeatherOpenMeteo(lat, lon) {
  var w=new XMLHttpRequest();
  var proto = window.location.protocol === 'https:' ? 'https:' : 'http:';
  w.open('GET', proto+'//api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true');
  w.onload=function(){
    if(w.status===200){
      try{
        var d=JSON.parse(w.responseText);
        var temp=Math.round(d.current_weather.temperature)+'°';
        var c=d.current_weather.weathercode, icon='🌤️';
        if(c===0)icon='☀️';
        else if(c<=3)icon='🌤️';
        else if(c===45||c===48)icon='🌫️';
        else if((c>=51&&c<=67)||(c>=80&&c<=82))icon='🌧️';
        else if((c>=71&&c<=77)||c===85||c===86)icon='❄️';
        else if(c>=95)icon='⛈️';
        document.getElementById('wIcon').textContent=icon;
        document.getElementById('wTemp').textContent=temp;
      }catch(e){
        document.getElementById('wIcon').textContent='E3';
        document.getElementById('wTemp').textContent='parse';
      }
    }else{
      document.getElementById('wIcon').textContent='E2';
      document.getElementById('wTemp').textContent=w.status;
    }
  };
  w.onerror=function(){
    document.getElementById('wIcon').textContent='E2';
    document.getElementById('wTemp').textContent='net';
  };
  w.send();
}

function fetchWeather(){
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      fetchWeatherOpenMeteo(pos.coords.latitude, pos.coords.longitude);
    }, function() {
      fetchWeatherOpenMeteo(25.0478, 121.5319);
    }, { timeout: 5000 });
  } else {
    fetchWeatherOpenMeteo(25.0478, 121.5319);
  }
}
fetchWeather();
setInterval(fetchWeather,1800000);

function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}

function resize(src,cb){
  var i=new Image();
  i.onload=function(){
    var s=Math.min(1024/i.width,768/i.height,1);
    var c=document.createElement('canvas');
    c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);
    c.getContext('2d').drawImage(i,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',0.75));
  };i.src=src;
}

function load(inp){
  var fileArray=[];
  for(var i=0; i<inp.files.length; i++) fileArray.push(inp.files[i]);
  var files=shuffle(fileArray).slice(0,20);
  if(!files.length)return;
  document.getElementById('welcome').style.display='none';
  document.getElementById('settings').classList.remove('show');
  var ld=document.getElementById('loading');
  ld.classList.add('show');
  photos=[];var done=0;
  files.forEach(function(f){
    var r=new FileReader();
    r.onload=function(e){
      resize(e.target.result,function(d){
        photos.push(d);done++;
        var p=Math.round(done/files.length*100);
        document.getElementById('fill').style.width=p+'%';
        document.getElementById('loadTxt').textContent='Loading '+p+'%';
        if(done===files.length){
          ld.classList.remove('show');
          document.getElementById('pc').textContent=photos.length+' photos';
          start();
        }
      });
    };r.readAsDataURL(f);
  });
}

function start(){
  if(!photos.length)return;
  A.style.backgroundImage='url('+photos[0]+')';A.style.opacity=1;A.style.transform='';A.style.zIndex=1;
  B.style.opacity=0;B.style.transform='';B.style.zIndex=2;
  layer='A';idx=0;
  if(timer)clearInterval(timer);
  timer=setInterval(next,ivl);
}

function next(){
  if(photos.length<2||busy)return;
  busy=true;
  var ni=(idx+1)%photos.length,ef=EFX[efxIdx],w=window.innerWidth,h=window.innerHeight;
  var top=layer==='A'?B:A,bot=layer==='A'?A:B;
  top.style.backgroundImage='url('+photos[ni]+')';top.style.transform='';top.style.opacity=0;top.style.transition='none';top.style.zIndex=2;bot.style.zIndex=1;
  setTimeout(function(){
    if(ef==='fade'){
      top.style.transition='opacity 1.8s';bot.style.transition='opacity 1.8s';
      top.style.opacity=1;bot.style.opacity=0;
    }else if(ef==='slideLeft'){
      top.style.transform='translateX('+w+'px)';top.style.opacity=1;
      top.style.transition='transform 1.5s ease';bot.style.transition='transform 1.5s ease';
      setTimeout(function(){top.style.transform='translateX(0)';bot.style.transform='translateX(-'+w+'px)';},20);
    }else{
      top.style.transform='translateY('+h+'px)';top.style.opacity=1;
      top.style.transition='transform 1.5s ease';bot.style.transition='transform 1.5s ease';
      setTimeout(function(){top.style.transform='translateY(0)';bot.style.transform='translateY(-'+h+'px)';},20);
    }
    setTimeout(function(){
      layer=layer==='A'?'B':'A';idx=ni;
      bot.style.transition='none';bot.style.transform='';bot.style.opacity=0;
      busy=false;
    },2100);
  },50);
}

document.getElementById('wrap').addEventListener('click',function(){
  if(photos.length)document.getElementById('settings').classList.add('show');
  renderSettings();
});

function renderSettings(){
  var e=document.getElementById('efx');e.innerHTML='';
  EFX.forEach(function(x,i){
    var d=document.createElement('div');d.className='row'+(i===efxIdx?' on':'');
    d.innerHTML=ELBL[x]+(i===efxIdx?'<span class="ck">✓</span>':'');
    d.onclick=function(){efxIdx=i;renderSettings();};e.appendChild(d);
  });
  var iv=document.getElementById('ivl');iv.innerHTML='';
  IVL.forEach(function(it){
    var d=document.createElement('div');d.className='row'+(it.v===ivl?' on':'');
    d.innerHTML=it.l+(it.v===ivl?'<span class="ck">✓</span>':'');
    d.onclick=function(){ivl=it.v;if(timer)clearInterval(timer);timer=setInterval(next,ivl);renderSettings();};
    iv.appendChild(d);
  });
}
</script>
</body>
</html>
